<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI3 南港美食 3D 午餐選擇器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#0f1226;color:#fff}
#canvas-container{position:fixed;inset:0}
header{position:fixed;top:0;left:0;right:0;padding:14px 22px;font-size:20px;font-weight:700;background:rgba(15,18,38,.55);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1);z-index:5}
header small{font-weight:400;font-size:13px;opacity:.7;margin-left:8px}
#ui-container{position:fixed;top:70px;left:18px;width:290px;max-height:calc(100% - 90px);overflow:auto;padding:18px;border-radius:16px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 32px rgba(0,0,0,.35);z-index:5}
h3{font-size:14px;margin:14px 0 8px;opacity:.85}h3:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);cursor:pointer;font-size:14px;user-select:none}
.opts label:has(input:checked){background:#ff7a45}
.opts input{accent-color:#fff}
#count{margin:16px 0 10px;font-size:14px}
#count b{color:#ffd166;font-size:20px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff7a45,#ff3d71);width:100%}
button:disabled{background:#555;cursor:not-allowed;opacity:.6}
#hint{font-size:12px;color:#ff9b9b;margin-top:6px;min-height:16px}
#result-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:10}
#result-modal.hidden{display:none}
.card{width:min(380px,92vw);padding:26px;border-radius:20px;background:rgba(30,34,66,.92);border:1px solid rgba(255,255,255,.2);text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card .label{opacity:.7;font-size:13px}
.card h2{font-size:26px;margin:8px 0 12px;color:#ffd166}
.card .meta{font-size:15px;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}
.tags span{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.card .btns{display:grid;gap:8px}
.card .sec{background:rgba(255,255,255,.12)}
.note{font-size:11px;opacity:.5;margin-top:14px}
@media (max-width:700px){#ui-container{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:45%}header{font-size:16px}}
</style>
</head>
<body>
<div id="canvas-container"></div>
<header><i class="fa-solid fa-utensils"></i> AI3 南港午餐 3D 決策器<small>南港軟體園區 · 半徑 2km</small></header>

<div id="ui-container">
  <h3><i class="fa-solid fa-person-walking"></i> 距離</h3>
  <div class="opts" id="dist">
    <label><input type="radio" name="d" value="500">500m</label>
    <label><input type="radio" name="d" value="1000">1km</label>
    <label><input type="radio" name="d" value="2000" checked>2km</label>
  </div>
  <h3><i class="fa-solid fa-snowflake"></i> 環境</h3>
  <div class="opts"><label><input type="checkbox" id="ac" checked>必須有冷氣</label></div>
  <h3><i class="fa-solid fa-bowl-food"></i> 種類</h3>
  <div class="opts" id="cats"></div>
  <div id="count">符合條件：<b id="n">0</b> 間</div>
  <button id="go"><i class="fa-solid fa-dice"></i> 開始決策！</button>
  <div id="hint"></div>
</div>

<div id="result-modal" class="hidden">
  <div class="card">
    <div class="label">今天就吃這家 🎉</div>
    <h2 id="r-name"></h2>
    <div class="meta" id="r-meta"></div>
    <div class="tags" id="r-tags"></div>
    <div class="btns">
      <button id="r-map"><i class="fa-solid fa-location-dot"></i> 開啟 Google 地圖導航</button>
      <button class="sec" id="r-again"><i class="fa-solid fa-rotate"></i> 不滿意，再抽一次</button>
      <button class="sec" id="r-filter"><i class="fa-solid fa-sliders"></i> 重新篩選</button>
    </div>
    <div class="note">距離為估算值，營業時間請以 Google 地圖為準</div>
  </div>
</div>

<script>
// ===== 1. 餐廳資料庫（距離為從南港軟體園區估算，需實地核對）=====
const CATS = ["麵","飯","鍋貼/水餃","漢堡/美式","小吃/湯包","健康餐/沙拉"];
const R = (id,name,d,ac,cats,price)=>({id,name,distanceMeters:d,hasAC:ac,categories:cats,priceRange:price,
  googleMapUrl:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(name+" 南港")});
const DEFAULT_DATA = [
  // 南港軟體園區內 / 三重路周邊（店名與位置取自網路美食文章，2026-11 查）
  R("r01","OSHO拉麵 (南港軟體園區)",200,true,["麵"],"$$"),
  R("r02","大河屋 南港中信店",300,true,["飯"],"$$"),
  R("r03","春月日式食堂",400,true,["飯"],"$$"),
  R("r04","三川田輕麻辣風麵食館",450,false,["麵","小吃/湯包"],"$"),
  R("r05","Gonna 共樂遊食",400,true,["健康餐/沙拉","漢堡/美式"],"$$"),
  // 南港車站 / CITYLINK / 南港環球
  R("r06","朱記餡餅粥店 (南港環球店)",1300,true,["麵","飯","鍋貼/水餃"],"$$"),
  R("r07","北大荒水餃 (南港)",1300,false,["鍋貼/水餃","麵"],"$"),
  R("r08","台鐵夢工場 南港店",1300,true,["飯"],"$"),
  R("r09","爭鮮 (南港)",1300,true,["飯"],"$$"),
  R("r10","好好食房 (CITYLINK南港)",1300,true,["麵","飯"],"$$"),
  R("r11","麵家三士 (CITYLINK南港)",1300,true,["麵"],"$$"),
  R("r12","美利茶餐廳 (CITYLINK南港)",1300,true,["麵","飯","小吃/湯包"],"$$"),
  R("r13","杏子日式豬排 (CITYLINK南港)",1300,true,["飯"],"$$"),
  R("r14","The Chips 美式餐廳 (CITYLINK南港)",1300,true,["漢堡/美式"],"$$$"),
  R("r15","貳樓 Second Floor (CITYLINK南港)",1300,true,["漢堡/美式","健康餐/沙拉"],"$$$"),
];
let DATA = DEFAULT_DATA;
try{const s=localStorage.getItem("ai3-restaurants"); if(s) DATA=JSON.parse(s);}catch(e){}

// ===== 2. Three.js 初始化 =====
const box=document.getElementById("canvas-container");
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
box.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0f1226);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,-1.2,11); camera.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(4,6,10); scene.add(dl);
const pl=new THREE.PointLight(0xff7a45,0.6,30); pl.position.set(-6,-4,6); scene.add(pl);

const wheelGroup=new THREE.Group(); scene.add(wheelGroup);
// 指針
const pointer=new THREE.Mesh(new THREE.ConeGeometry(0.35,0.8,3),new THREE.MeshStandardMaterial({color:0xffd166,metalness:.4,roughness:.3}));
pointer.rotation.z=Math.PI; pointer.position.set(0,4.15,0.6); scene.add(pointer);
// 底座環
const ring=new THREE.Mesh(new THREE.TorusGeometry(3.85,0.12,16,100),new THREE.MeshStandardMaterial({color:0xffd166,metalness:.7,roughness:.25}));
ring.position.z=0.3; scene.add(ring);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h); camera.aspect=w/h;
  const mobile=w<700;
  camera.position.z = mobile ? 15 : 11;
  scene.position.set(mobile?0:1.8, mobile?2.2:0, 0);
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize); resize();

// ===== 3. 動態輪盤生成 =====
const COLORS=[0xff7a45,0x3a86ff,0x06d6a0,0xef476f,0x8338ec,0xffbe0b,0x118ab2,0xf15bb5];
function textTexture(text){
  const c=document.createElement("canvas"); c.width=512; c.height=96;
  const g=c.getContext("2d");
  let size=52; g.font=`bold ${size}px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif`;
  while(g.measureText(text).width>490 && size>18){size-=2; g.font=`bold ${size}px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif`;}
  g.fillStyle="#fff"; g.textAlign="right"; g.textBaseline="middle";
  g.shadowColor="rgba(0,0,0,.5)"; g.shadowBlur=6;
  g.fillText(text,500,48);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function clearWheel(){
  while(wheelGroup.children.length){const m=wheelGroup.children.pop();
    m.geometry.dispose(); if(m.material.map) m.material.map.dispose(); m.material.dispose();}
}
let slices=[];
function buildWheel(list){
  clearWheel(); slices=list;
  const n=Math.max(list.length,1), seg=Math.PI*2/n;
  list.forEach((r,i)=>{
    // CylinderGeometry 的 theta 繞 Y 軸，旋轉 X 90° 讓它面向相機
    const geo=new THREE.CylinderGeometry(3.7,3.7,0.4,Math.max(4,Math.ceil(64/n)),1,false,i*seg,seg);
    const mat=new THREE.MeshStandardMaterial({color:COLORS[i%COLORS.length],roughness:.45,metalness:.15});
    const m=new THREE.Mesh(geo,mat); m.rotation.x=Math.PI/2; wheelGroup.add(m);
    // 文字貼圖：放在扇形中線
    const mid=i*seg+seg/2; // cylinder theta: x=sin, z=cos → 轉 X 後 (sin, -cos)?? 計算如下
    const ang=Math.atan2(-Math.cos(mid),Math.sin(mid)); // 扇形中線在 XY 平面的角度
    const label=new THREE.Mesh(new THREE.PlaneGeometry(3.3,0.62),
      new THREE.MeshBasicMaterial({map:textTexture(r.name),transparent:true,depthWrite:false}));
    label.position.set(Math.cos(ang)*1.95,Math.sin(ang)*1.95,0.22);
    label.rotation.z=ang; wheelGroup.add(label);
    r._ang=ang;
  });
  if(!list.length){
    const label=new THREE.Mesh(new THREE.PlaneGeometry(4,0.75),new THREE.MeshBasicMaterial({map:textTexture("沒有符合的餐廳"),transparent:true}));
    label.position.x=-2; wheelGroup.add(label);
  }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.6,32),new THREE.MeshStandardMaterial({color:0xffffff,metalness:.5,roughness:.3}));
  hub.rotation.x=Math.PI/2; wheelGroup.add(hub);
}

// ===== 4. 篩選 =====
const catBox=document.getElementById("cats");
CATS.forEach(c=>catBox.insertAdjacentHTML("beforeend",`<label><input type="checkbox" value="${c}" checked>${c}</label>`));
function filtered(){
  const d=+document.querySelector('input[name=d]:checked').value;
  const ac=document.getElementById("ac").checked;
  const cs=[...catBox.querySelectorAll("input:checked")].map(i=>i.value);
  return DATA.filter(r=>r.distanceMeters<=d && (!ac||r.hasAC) && r.categories.some(c=>cs.includes(c)));
}
const goBtn=document.getElementById("go"), hint=document.getElementById("hint");
function refresh(){
  const list=filtered();
  document.getElementById("n").textContent=list.length;
  goBtn.disabled=!list.length || spinning;
  hint.textContent=list.length?"":"沒有符合條件的餐廳，請放寬篩選";
  wheelGroup.rotation.z=0; buildWheel(list);
}
document.getElementById("ui-container").addEventListener("change",()=>{if(!spinning)refresh();});

// ===== 5. 轉動動畫（Ease-Out）=====
let spinning=false, spin=null, idle=true;
const easeOutCubic=t=>1-Math.pow(1-t,3);
function startSpin(){
  if(!slices.length||spinning) return;
  spinning=true; idle=false; goBtn.disabled=true;
  const pick=Math.floor(Math.random()*slices.length);
  const target=slices[pick];
  // 指針在 +Y (π/2)；要讓 target._ang + rot ≡ π/2
  const cur=wheelGroup.rotation.z;
  let end=Math.PI/2-target._ang;
  end+= Math.ceil((cur-end)/(Math.PI*2))*Math.PI*2 ; // 對齊到 cur 之上
  end+= Math.PI*2*6; // 多轉 6 圈
  const seg=Math.PI*2/slices.length;
  end+= (Math.random()-.5)*seg*0.6; // 扇形內隨機偏移
  spin={from:cur,to:end,t0:performance.now(),dur:3000,pick:target};
}

// ===== 粒子 Confetti =====
let confetti=null;
function burst(){
  const N=400, pos=new Float32Array(N*3), col=new Float32Array(N*3), vel=[];
  const c=new THREE.Color();
  for(let i=0;i<N;i++){
    pos.set([0,3.5,1],i*3);
    vel.push(new THREE.Vector3((Math.random()-.5)*0.35,Math.random()*0.3+0.05,(Math.random()-.2)*0.25));
    c.setHex(COLORS[i%COLORS.length]); col.set([c.r,c.g,c.b],i*3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  if(confetti){scene.remove(confetti.pts);confetti.pts.geometry.dispose();}
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:0.14,vertexColors:true,transparent:true}));
  scene.add(pts); confetti={pts,vel,life:0};
}

// ===== 6. 結果 =====
const modal=document.getElementById("result-modal"); let current=null;
function showResult(r){
  current=r;
  document.getElementById("r-name").textContent=r.name;
  const mins=Math.max(1,Math.round(r.distanceMeters/80));
  document.getElementById("r-meta").textContent=`${r.distanceMeters} 公尺，步行約 ${mins} 分鐘 · ${r.priceRange}`;
  document.getElementById("r-tags").innerHTML=[r.hasAC?"❄️ 有冷氣":"🌤 無冷氣",...r.categories].map(t=>`<span>${t}</span>`).join("");
  modal.classList.remove("hidden");
}
document.getElementById("r-map").onclick=()=>window.open(current.googleMapUrl,"_blank");
document.getElementById("r-again").onclick=()=>{modal.classList.add("hidden");startSpin();};
document.getElementById("r-filter").onclick=()=>{modal.classList.add("hidden");idle=true;};
goBtn.onclick=startSpin;

// ===== 渲染迴圈 =====
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/16.67,3); last=now;
  if(spin){
    const t=Math.min((now-spin.t0)/spin.dur,1);
    wheelGroup.rotation.z=spin.from+(spin.to-spin.from)*easeOutCubic(t);
    if(t>=1){const r=spin.pick; spin=null; spinning=false; goBtn.disabled=!slices.length; burst(); setTimeout(()=>showResult(r),500);}
  }else if(idle){ wheelGroup.rotation.z+=0.002*dt; }
  wheelGroup.rotation.x=Math.sin(now/1800)*0.06;
  if(confetti){
    const p=confetti.pts.geometry.attributes.position;
    for(let i=0;i<confetti.vel.length;i++){
      const v=confetti.vel[i]; v.y-=0.006*dt; v.multiplyScalar(0.99);
      p.array[i*3]+=v.x*dt; p.array[i*3+1]+=v.y*dt; p.array[i*3+2]+=v.z*dt;
    }
    p.needsUpdate=true; confetti.life+=dt;
    confetti.pts.material.opacity=Math.max(0,1-confetti.life/180);
    if(confetti.life>180){scene.remove(confetti.pts);confetti.pts.geometry.dispose();confetti=null;}
  }
  renderer.render(scene,camera);
}
refresh(); requestAnimationFrame(loop);
</script>
</body>
</html>
